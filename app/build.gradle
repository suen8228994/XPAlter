plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.posed.xpalter'
    compileSdk 28

    defaultConfig {
        applicationId "com.posed.xpalter"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.3.2' // 适配 API 28 的版本
    implementation 'androidx.appcompat:appcompat:1.2.0' // 保持现有版本
    implementation 'com.google.android.material:material:1.2.1' // 保持现有版本
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.preference:preference:1.1.1' // 保持现有版本
    implementation "androidx.constraintlayout:constraintlayout:2.0.4" // 保持现有版本
    compileOnly 'de.robv.android.xposed:api:82' // Xposed API 兼容
    implementation 'com.google.code.gson:gson:2.8.5' // 保持现有版本
}